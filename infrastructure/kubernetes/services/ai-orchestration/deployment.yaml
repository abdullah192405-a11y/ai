apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration
  namespace: wba-ai
  labels:
    app: ai-orchestration
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ai-orchestration
  template:
    metadata:
      labels:
        app: ai-orchestration
        version: v1
    spec:
      containers:
        - name: ai-orchestration
          image: ECR_REGISTRY/wba-ai-orchestration:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: production
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wba-secrets
                  key: redis-url
            - name: KNOWLEDGE_BASE_URL
              value: http://knowledge-base.wba-ai.svc.cluster.local:8002
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway.wba-ai.svc.cluster.local:8003
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ai-orchestration

---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestration
  namespace: wba-ai
spec:
  selector:
    app: ai-orchestration
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-orchestration-scaler
  namespace: wba-ai
spec:
  scaleTargetRef:
    name: ai-orchestration
  minReplicaCount: 4
  maxReplicaCount: 30
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.wba-infra.svc.cluster.local:9090
        metricName: ai_concurrent_requests
        threshold: "50"
        query: sum(ai_orchestration_active_requests)
