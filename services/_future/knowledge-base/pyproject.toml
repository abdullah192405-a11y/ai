[project]
name = "wba-knowledge-base"
version = "1.0.0"
description = "Knowledge Base Service — Document ingestion, chunking, embedding, RAG retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "boto3>=1.36.0",
    "qdrant-client>=1.12.0",
    "openai>=1.58.0",
    "tiktoken>=0.8.0",
    "langchain-text-splitters>=0.3.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.49.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
