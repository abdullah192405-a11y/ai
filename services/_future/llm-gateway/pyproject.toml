[project]
name = "wba-llm-gateway"
version = "1.0.0"
description = "LLM Gateway Service — Model abstraction, fallback chains, cost tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "openai>=1.58.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "circuitbreaker>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
